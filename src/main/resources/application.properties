# Web server port (8080 was already used on this PC)
server.port=8081

# Read config.properties too. It sits next to pom.xml and holds the secrets.
# Passwords are NEVER written in this file or in the Java code.
spring.config.import=file:./config.properties

# Database connection. The ${...} parts are filled in from config.properties.
spring.datasource.url=${hibernate.db.url}
spring.datasource.username=${db.user}
spring.datasource.password=${db.password}

# update = create missing tables/columns, keep existing data (same as Stage 5)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
